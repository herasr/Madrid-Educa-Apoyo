name: Update educational resources

on:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          if [ -f pipelines/requirements.txt ]; then pip install -r pipelines/requirements.txt; fi

      - name: Ingest sources
        run: python -m pipelines.ingest

      - name: Validate data integrity
        run: python -m pipelines.validate

      - name: Reconcile entities
        run: python -m pipelines.reconcile

      - name: Detect changes & compute evidence
        run: python -m pipelines.detect_changes

      - name: Export approved datasets
        run: python -m pipelines.export

      - name: Generate web data module from official data
        run: python scripts/build_app_data.py

      - name: Upload review queue (if the official source changed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-y-productos-de-datos
          path: |
            data/review/
            data_products/
            data/raw/educacion_cam/metadata.json
          if-no-files-found: ignore

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Web dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web application
        run: npm run build

