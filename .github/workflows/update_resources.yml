name: Update educational resources

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          if [ -f pipelines/requirements.txt ]; then pip install -r pipelines/requirements.txt; fi

      - name: Ingest sources (PDF TEA + Portal de Datos Abiertos CAM + Ayto. Madrid)
        run: python -m pipelines.ingest

      - name: Validate data integrity
        run: python -m pipelines.validate

      - name: Reconcile entities
        run: python -m pipelines.reconcile

      - name: Detect changes & compute evidence
        run: python -m pipelines.detect_changes

      - name: Export approved datasets
        run: python -m pipelines.export

      - name: Generate web data module from official data
        run: python scripts/build_app_data.py

      - name: Verify snapshot integrity (sha256_instantanea_repo)
        run: python scripts/snapshot_hashes.py --check

      - name: Run Python pipeline tests (pytest)
        run: python -m pytest -v

      - name: Upload review queue & open data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-y-productos-de-datos
          path: |
            data/review/
            data_products/
            data/raw/educacion_cam/metadata.json
          if-no-files-found: ignore

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Web dependencies
        run: npm ci

      - name: TypeScript typecheck (lint)
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build web application for GitHub Pages
        env:
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/"
          VITE_SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: npm run build

      - name: Setup GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site artifact for GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Web dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build for local preview
        env:
          VITE_BASE_PATH: "/"
          VITE_SITE_URL: "http://localhost:4173"
        run: npm run build

      - name: Run Playwright E2E & WCAG real-browser tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-pages:
    needs: [update, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
